<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
 
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
    /* Gradient yang sama, tapi tanpa filter:blur & elemen pseudo berat */
    background:
      radial-gradient(circle at top left, rgba(139,92,246,.35), transparent 35%),
      radial-gradient(circle at bottom right, rgba(59,130,246,.35), transparent 35%),
      linear-gradient(135deg,#0f172a,#111827,#1e293b);
    background-color:#111827;
  }
 
  .about-wrapper{
    text-align:center;
    padding:20px;
    width:100%;
  }
 
  .about-wrapper h1{
    font-size:40px;
    margin-bottom:25px;
    color:#fff;
    letter-spacing:2px;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
 
  .card-container{
    display:inline-block;
    padding:12px;
    border-radius:24px;
    background:linear-gradient(135deg,#8b5cf6,#3b82f6,#06b6d4,#8b5cf6);
    box-shadow:0 0 24px rgba(139,92,246,.4);
    /* isolasi repaint saat zoom/scroll */
    contain:layout paint;
  }
 
  .card-container iframe{
    display:block;
    border:none;
    width:415px;
    height:228px;
    border-radius:18px;
    background:#fff;
  }
 
  @media(max-width:500px){
    .about-wrapper h1{font-size:30px}
    .card-container{width:100%;max-width:440px}
    .card-container iframe{width:100%;max-width:415px}
  }
</style>
</head>
<body>
  <div class="about-wrapper">
    <h1>About Me</h1>
    <div class="card-container">
      <iframe src="https://gravatar.com/luisadha.card" loading="lazy" title="Gravatar card"></iframe>
    </div>
  </div>
</body>
</html>
